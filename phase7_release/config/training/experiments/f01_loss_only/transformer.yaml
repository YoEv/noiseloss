experiment_family_id: "f01"
experiment_family_name: "loss_only"
backbone: "transformer"

legacy_script_key: "train_hybrid_transformer_cnn_pool"

data:
  manifest_columns_required:
    - "score"
    - "audio_path"
    - "token_loss_path"
  label_column: "score"
  mode_hint: "loss_only_sequence"

optimization:
  batch_size: 16
  num_workers: 6
  epochs: 10
  lr: 0.0001
  weight_decay: 0.01
  scheduler: "cosine"

checkpoint:
  name_template: "f01_loss_only_transformer_{dataset_scope}"
