label_mode: "clean"  # clean | noisy

split_seed: 42
split_strategy: "source_stratified"  # source_stratified | global_random

splits:
  train: "train.csv"
  val: "val.csv"
  test: "test.csv"
  train_noisy: "train_noisy.csv"
  val_noisy: "val_noisy.csv"
  test_noisy: "test_noisy.csv"

dataset_scopes:
  small_scale: ["musiceval"]
  large_scale_single: ["musicpref", "aime", "songeval", "musiceval", "music_arena"]
  large_scale_merged: ["all_5_datasets"]
